<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Signal Brain V3 public architecture</title>
  <desc id="desc">Market data feeds a signal engine and demo exchange. Reconciliation persists to SQLite and reports to Telegram and Google Sheets.</desc>
  <style>
    .bg { fill:#0b1220; } .box { fill:#16233b; stroke:#4f7cff; stroke-width:2; rx:16; }
    .safe { fill:#123b35; stroke:#42c89b; stroke-width:2; rx:16; }
    .report { fill:#3c2b13; stroke:#f5bd5a; stroke-width:2; rx:16; }
    .h { fill:#f8fafc; font:700 23px Arial,sans-serif; } .t { fill:#cbd5e1; font:16px Arial,sans-serif; }
    .s { fill:#9fb3c8; font:14px Arial,sans-serif; } .line { stroke:#9fb3c8; stroke-width:2.5; fill:none; marker-end:url(#arrow); }
  </style>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9fb3c8"/></marker></defs>
  <rect class="bg" width="1200" height="620"/>
  <text x="55" y="58" class="h">Signal Brain V3 — public, demo-first architecture</text>
  <text x="55" y="86" class="s">Sanitized showcase: no credentials, live orders, account data, or production source code.</text>
  <rect class="box" x="55" y="155" width="200" height="104"/><text x="85" y="195" class="h">Market data</text><text x="85" y="222" class="t">Public candles</text>
  <rect class="box" x="340" y="155" width="230" height="104"/><text x="372" y="195" class="h">Signal + risk</text><text x="372" y="222" class="t">Grade · confidence · risk</text>
  <rect class="safe" x="655" y="155" width="230" height="104"/><text x="686" y="195" class="h">Demo exchange</text><text x="686" y="222" class="t">Orders · fills · SL/TP</text>
  <rect class="box" x="490" y="365" width="250" height="112"/><text x="526" y="407" class="h">Reconciliation</text><text x="526" y="435" class="t">Restart and close events</text>
  <rect class="safe" x="825" y="365" width="205" height="112"/><text x="869" y="407" class="h">SQLite ledger</text><text x="856" y="435" class="t">Durable context</text>
  <rect class="report" x="240" y="520" width="210" height="65"/><text x="285" y="560" class="h">Telegram</text>
  <rect class="report" x="710" y="520" width="260" height="65"/><text x="748" y="560" class="h">Google Sheets</text>
  <path class="line" d="M255 207 H338"/><path class="line" d="M570 207 H653"/><path class="line" d="M770 260 V330 H615 V363"/>
  <path class="line" d="M740 420 H823"/><path class="line" d="M825 476 V550 H710"/><path class="line" d="M600 477 V550 H450"/>
  <text x="988" y="555" class="s">One-way reporting</text>
</svg>
